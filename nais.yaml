apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: aura
  name: gemini
  namespace: aura
spec:
  image: {{ image }}
  env:
    - name: DATABASE_CONNECTION_LIMIT
      value: "2"
    - name: REDIRECT_URL
      value: https://gemini.external.prod-gcp.nav.cloud.nais.io/oauth2/callback
    - name: BIND_ADDRESS
      value: 0.0.0.0:3000
    - name: METRICS_BIND_ADDRESS
      value: 0.0.0.0:3001
    - name: TZ
      value: Europe/Oslo
  azure:
    application:
      allowAllUsers: true
      enabled: true
      tenant: nav.no
  gcp:
    sqlInstances:
    - cascadingDelete: false
      databases:
      - envVarPrefix: DATABASE
        name: gemini
      diskAutoresize: true
      diskSize: 10
      diskType: SSD
      highAvailability: false
      name: gemini
      tier: db-f1-micro
      type: POSTGRES_14
  ingresses:
  - https://gemini.external.prod-gcp.nav.cloud.nais.io
  observability:
    logging:
      destinations:
        - id: loki
  port: 3000
  prometheus:
    enabled: true
    port: "3001"
    path: /metrics
  replicas:
    cpuThresholdPercentage: 50
    max: 1
    min: 1
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 500m
