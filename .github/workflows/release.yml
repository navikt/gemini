name: NAIS deploy release pipeline

on:
  push: {}

env:
  image: ghcr.io/${{ github.repository }}/gemini

jobs:

  build:
    name: Build Docker container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate version tag
        run: echo "version=$(./version.sh)" >> $GITHUB_ENV
      - name: Build Docker image
        run: docker build --tag ${image}:${version} --tag ${image}:latest .
      - name: Push versioned Docker image to GitHub
        if: github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io -u ${GITHUB_REPOSITORY} -p ${GITHUB_TOKEN}
          docker push ${image}:${version}
          docker push ${image}:latest
          echo "digest=$(docker images --no-trunc --quiet ${image}:${version})" >> $GITHUB_ENV
      - uses: nais/attest-sign@v1
        name: Attest and sign SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image_ref: ${{ env.image }}@${{ env.digest }}

  deploy:
    name: Deploy to NAIS
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate version tag
        run: echo "version=$(./version.sh)" >> $GITHUB_ENV
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-gcp
          RESOURCE: nais.yaml
          VAR: image=${{ env.image }}:${{ env.version }}
